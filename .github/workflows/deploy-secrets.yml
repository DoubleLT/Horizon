name: Deploy Twitter Secrets to Server

on:
  workflow_dispatch:

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/server.pem
          chmod 600 ~/.ssh/server.pem
          ssh-keyscan -H 122.51.163.118 >> ~/.ssh/known_hosts

      - name: Update .env on server
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          ssh -i ~/.ssh/server.pem ubuntu@122.51.163.118 \
            "sed -i 's|^TWITTER_AUTH_TOKEN=.*|TWITTER_AUTH_TOKEN=${{ secrets.TWITTER_AUTH_TOKEN }}|' ~/Horizon/.env && \
             sed -i 's|^TWITTER_CT0=.*|TWITTER_CT0=${{ secrets.TWITTER_CT0 }}|' ~/Horizon/.env && \
             echo 'Done' && grep TWITTER ~/Horizon/.env | sed 's/=.*/=****/'"
